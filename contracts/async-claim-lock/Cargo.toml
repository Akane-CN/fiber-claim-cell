[package]
name = "async-claim-lock"
version = "0.1.0"
edition = "2021"

[dependencies]
ckb-std = { version = "1.1.0", default-features = false, features = ["allocator"] }
blake2b-ref = "0.3.1"
sha2 = { version = "0.10", default-features = false }

[profile.release]
overflow-checks = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
